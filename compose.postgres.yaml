# Explicit bundled PostgreSQL only. See docs/upgrading.md before upgrading.
# Required external volume name prevents a renamed checkout/project from silently
# creating an empty database. Create it yourself for a NEW installation only.
services:
  app:
    environment:
      PGHOST: db
      PGPORT: '5432'
      PGDATABASE: '${PGDATABASE:?Set the existing or new PGDATABASE explicitly}'
      PGUSER: '${PGUSER:?Set the existing or new PGUSER explicitly}'
      PGPASSWORD: '${PGPASSWORD:-}'
      PGPASSWORD_FILE: '${PGPASSWORD_FILE:-}'
      # Deliberate bundled-network default; external hosts never infer this.
      PGSSLMODE: '${PGSSLMODE:-disable}'
      PGSSLROOTCERT: '${PGSSLROOTCERT:-}'
    volumes:
      - ./postgres-secrets:/run/postgres-secrets:ro
    depends_on:
      db:
        condition: service_healthy
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: '${PGDATABASE:?Set the existing or new PGDATABASE explicitly}'
      POSTGRES_USER: '${PGUSER:?Set the existing or new PGUSER explicitly}'
      # The official image requires exactly one nonempty password source.
      POSTGRES_PASSWORD: '${PGPASSWORD:-}'
      POSTGRES_PASSWORD_FILE: '${PGPASSWORD_FILE:-}'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Never expose APP_SECRET/bootstrap files to the database container.
      - ./postgres-secrets:/run/postgres-secrets:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 5s
      retries: 12
    security_opt:
      - no-new-privileges:true
volumes:
  postgres_data:
    external: true
    name: '${POSTGRES_VOLUME:?Set POSTGRES_VOLUME to the exact existing Docker volume, or explicitly create one for a new installation}'
