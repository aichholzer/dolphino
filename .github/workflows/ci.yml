name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: dolphino_test
          POSTGRES_PASSWORD: testonly
          POSTGRES_DB: dolphino_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dolphino_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: dolphino_test
      PGUSER: dolphino_test
      PGPASSWORD: testonly
      PGSSLMODE: disable
      CHROMIUM_PATH: /usr/bin/google-chrome
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - name: Unit tests with coverage
        run: npm run coverage
      - name: Browser checks with coverage, then the production build
        run: npm run coverage:browser
      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo '### Coverage'
            echo '```'
            npx c8 report --reporter=text-summary
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: coverage
          path: |
            coverage/
            !coverage/v8/
          retention-days: 14
