# Default: connect only to the PostgreSQL explicitly configured in .env.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
