# Default: connect only to the PostgreSQL explicitly configured in .env.
services:
  app:
    build: .
    restart: unless-stopped
    # APP_SECRET or APP_SECRET_FILE comes from .env; no fixed key or DB fallback.
    env_file: .env
    ports:
      - '${APP_BIND:-127.0.0.1}:3001:3001'
    volumes:
      - ./secrets:/run/secrets:ro
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
